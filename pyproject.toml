[project]
name = "pythonproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ljj", email = "1357023255@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.4.1",
    "fastapi>=0.165.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.1",
    "langchain-deepseek>=1.2.0",
    "langchain-openai>=1.8.0",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-cli[inmem]>=0.4.43",
    "notebook>=7.6.5",
    "openai>=3.52.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pythonproject = "pythonproject:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
